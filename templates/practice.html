{% extends 'base.html' %}{% block content %}<section class="pageHead compact"><div class="badge">LEARNING LAB</div><h1>{{T.practice_title}}</h1><p>{{T.practice_desc}}</p><div class="progressBox"><div><b>{{T.progress}}</b><span id="progressCount">0/15</span></div><div class="progressTrack"><i id="progressBar"></i></div></div><div class="filters"><button onclick="filterEx('all')">{{T.all}}</button><button onclick="filterEx('easy')">{{T.easy}}</button><button onclick="filterEx('medium')">{{T.medium}}</button><button onclick="filterEx('hard')">{{T.hard}}</button></div></section><div class="exerciseGrid">{% for e in exercises %}<article class="exerciseCard" data-level="{{e.level}}" data-ex="{{e.id}}"><div class="exTop"><span>#{{'%02d'|format(e.id)}} • {{T.exercise}}</span><span class="level">{{T[e.level]}}</span></div><div class="codeLabel"><span>buggy_code.py</span><i>●</i></div><textarea id="ex{{e.id}}" spellcheck="false">{{e.code}}</textarea><button class="primary full" onclick="analyze('ex{{e.id}}','res{{e.id}}',{{e.id}})">▶ {{T.check_answer}}</button><div id="res{{e.id}}" class="miniResult"></div></article>{% endfor %}</div><script>function filterEx(l){document.querySelectorAll('.exerciseCard').forEach(x=>x.style.display=(l==='all'||x.dataset.level===l)?'block':'none')}</script>{% endblock %}
