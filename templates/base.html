<!doctype html><html lang="{{current_lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeDetective</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<div class="orb one"></div><div class="orb two"></div>
<header><a class="logo" href="/"><span class="logoMark">CD</span><span><b>{{T.brand}}</b><small>{{T.tag}}</small></span></a><nav><a href="/dashboard">{{T.dashboard}}</a><a href="/checker">{{T.checker}}</a><a href="/practice">{{T.practice}}</a><a href="/research">{{T.research}}</a><a href="/stats">{{T.stats}}</a><a href="/about">{{T.about}}</a></nav><div class="langs"><a href="/lang/kk" class="{{'active' if current_lang=='kk'}}">KZ</a><a href="/lang/ru" class="{{'active' if current_lang=='ru'}}">RU</a></div></header>
<main>{% block content %}{% endblock %}</main><footer>CodeDetective • Mendeshev Asilzhan • Python Education Research</footer>
<div id="toast" class="toast"></div>
<script>

function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
async function analyze(id='codeInput',out='analysis',exerciseId=null){let code=document.getElementById(id).value;let r=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});let d=await r.json();let el=document.getElementById(out);let cls=d.status==='success'?'ok':d.status==='error'?'bad':'warn';let h=`<div class="resultHead ${cls}"><span class="dot"></span><b>${d.message}</b></div>`;if(d.error_type)h+=`<div class="meta"><span>{{T.error}}: <b>${d.error_type}</b></span>${d.line?`<span>{{T.line}}: <b>${d.line}</b></span>`:''}</div>`;if(d.hints?.length){h+='<div class="hintStack">';d.hints.forEach((x,i)=>h+=`<details class="hint"><summary><span>${i+1}</span><b>{{T.hint}} ${i+1}</b></summary><p>${x}</p></details>`);h+='</div>'}el.innerHTML=h;el.classList.add('show');if(exerciseId){let done=JSON.parse(localStorage.getItem('cdDone')||'[]');if(!done.includes(exerciseId)){done.push(exerciseId);localStorage.setItem('cdDone',JSON.stringify(done))}updateProgress();}}
function updateProgress(){let done=JSON.parse(localStorage.getItem('cdDone')||'[]');document.querySelectorAll('[data-ex]').forEach(x=>{if(done.includes(Number(x.dataset.ex)))x.classList.add('done')});let n=document.getElementById('progressCount');if(n)n.textContent=done.length+'/15';let bar=document.getElementById('progressBar');if(bar)bar.style.width=(done.length/15*100)+'%'}
document.addEventListener('DOMContentLoaded',updateProgress)
</script></body></html>
