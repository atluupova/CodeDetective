{% extends 'base.html' %}{% block content %}<section class="pageHead"><div class="badge">RESEARCH DATA</div><h1>{{T.stats_title}}</h1><p>{{T.stats_desc}}</p></section><div class="statCards"><article><small>{{T.total}}</small><b>{{total}}</b></article><article><small>{{T.correct}}</small><b>{{correct}}</b></article><article><small>{{T.errors}}</small><b>{{errors}}</b></article><article><small>{{T.top_error}}</small><b class="smaller">{{top}}</b></article></div><section class="chartCard"><div><h2>Error distribution</h2><p>SQLite • live research data</p></div><canvas id="chart"></canvas></section><script>new Chart(document.getElementById('chart'),{type:'bar',data:{labels:{{labels|tojson}},datasets:[{label:'Errors',data:{{values|tojson}},borderWidth:1,borderRadius:8}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});</script>{% endblock %}
